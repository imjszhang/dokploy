services:
  # Dokploy 主应用
  dokploy:
    image: dokploy/dokploy:latest
    container_name: dokploy
    restart: unless-stopped
    environment:
      - DOKPLOY_SECRET=${DOKPLOY_SECRET}
      - DOKPLOY_ADMIN_EMAIL=${DOKPLOY_ADMIN_EMAIL}
      - DOKPLOY_ADMIN_PASSWORD=${DOKPLOY_ADMIN_PASSWORD}
      - DOKPLOY_DATABASE_URL=${DB_CONNECTION_STRING}
      - DOKPLOY_PORT=${DOKPLOY_PORT}
      - DOKPLOY_TRAEFIK_PATH=/etc/dokploy/traefik
      - DOKPLOY_TRAEFIK_DYNAMIC_PATH=/etc/dokploy/traefik/dynamic
      - NODE_ENV=${NODE_ENV:-development}
      - BASE_PATH=/etc/dokploy
      - MAIN_TRAEFIK_PATH=/etc/dokploy/traefik
      - DYNAMIC_TRAEFIK_PATH=/etc/dokploy/traefik/dynamic
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/vagrant/dokploy/data:/app/data
      - /home/vagrant/dokploy/traefik:/etc/dokploy/traefik:rw
      - /home/vagrant/dokploy/traefik/dynamic:/etc/dokploy/traefik/dynamic:rw
    depends_on:
      - db
      - traefik
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    user: "vagrant:vagrant"

  # Traefik 反向代理
  traefik:
    image: traefik:v3.1.2
    container_name: dokploy-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=${TRAEFIK_INSECURE_API}"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=dokploy-network"
      - "--providers.file.directory=/etc/dokploy/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=test@localhost.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/dokploy/traefik/dynamic/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--entrypoints.web.http.middlewares=redirect-to-https@file"
      - "--api.dashboard=true"
      - "--api.middlewares=auth@file"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/vagrant/dokploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /home/vagrant/dokploy/dynamic:/etc/dokploy/traefik/dynamic:ro
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.dokploy.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=web"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # 数据库服务
  db:
    image: postgres:15-alpine
    container_name: dokploy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/backup
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 监控服务
  monitoring:
    image: dokploy/monitoring:latest
    container_name: dokploy-monitoring
    restart: unless-stopped
    environment:
      - DOKPLOY_SECRET=${DOKPLOY_SECRET}
      - PROMETHEUS_MULTIPROC_DIR=/tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - dokploy
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

networks:
  dokploy-network:
    driver: bridge
    name: dokploy-network

# 定义命名卷
volumes:
  postgres_data:
  postgres_backup: